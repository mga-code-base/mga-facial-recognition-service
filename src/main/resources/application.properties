# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-facial-recognition-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8088

# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=${JWT_SECRET:}
# =======================================================
# AUTO-CONFIGURATION EXCLUSIONS
# =======================================================

# =======================================================
# DATABASE & JPA CONFIGURATION (PostgreSQL / Supabase pgvector)
# =======================================================
spring.datasource.url=${DATASOURCE_URL:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000

# =======================================================
# MULTIPART / FILE UPLOAD CONFIGURATION
# =======================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# =======================================================
# AI / DEEP JAVA LIBRARY (DJL) CONFIGURATION
# =======================================================
ai.djl.repository.zoo.location=file:///app/models

# =======================================================
# SPRING CLOUD CONFIGURATION
# =======================================================

# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}
mga.clients.people-crud-url=${PEOPLE_CRUD_URL:http://mga-people-crud-service.default.svc.cluster.local}
mga.clients.retry.max-attempts=3
mga.clients.retry.backoff=200ms
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
